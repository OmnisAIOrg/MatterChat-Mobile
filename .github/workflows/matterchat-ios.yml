name: MatterChat iOS (simulator build)
# Proves the fork builds + produces a Simulator .app artifact — NO signing, NO Apple account.
# TestFlight later = swap the xcodebuild step for the fastlane lane + App Store Connect key.
on:
  workflow_dispatch: {}
  push:
    branches: [matterchat, claude/matterchat-ios-android-apps-8nfz6b]
    paths-ignore: ["docs/**", "**.md"]
concurrency: { group: matterchat-ios, cancel-in-progress: true }
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: JS deps (pnpm via corepack)
        run: |
          npm i -g corepack
          corepack enable
          COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm install --frozen-lockfile || COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm install
      - name: Pods
        working-directory: ios
        run: |
          bundle install || true
          (bundle exec pod install || pod install)
      - name: Build for Simulator (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          # Ad-hoc signing (CODE_SIGN_IDENTITY=-) instead of CODE_SIGNING_ALLOWED=NO: the app's
          # MMKV storage needs the App Group entitlement; unsigned builds strip entitlements and
          # crash at launch ("multi-process MMKV without groupDir"). Ad-hoc needs no Apple account.
          # NOTE: no -sdk flag — it would force the Watch App target onto the iOS SDK
          # ("no such module 'WatchKit'"); the destination alone selects SDKs per target.
          # Runner images rotate their simulator lineup (iPhone 16 vanished mid-2026) —
          # pick the first available iPhone at runtime instead of pinning a model name.
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [^(]+' | head -1 | xargs)
          echo "building for simulator: ${DEVICE:-iPhone 17}"
          xcodebuild -workspace RocketChat.xcworkspace -scheme RocketChat \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${DEVICE:-iPhone 17}" \
            -derivedDataPath build CODE_SIGN_IDENTITY="-" | tail -80
      - name: Package artifact
        run: |
          APP=$(find ios/build/Build/Products -name "*.app" -maxdepth 3 | head -1)
          echo "app: $APP"
          ditto -c -k --keepParent "$APP" MatterChat-Simulator.app.zip
      - uses: actions/upload-artifact@v4
        with: { name: MatterChat-Simulator, path: MatterChat-Simulator.app.zip, retention-days: 14 }
